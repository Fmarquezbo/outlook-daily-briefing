version: '3.8'

services:
  api:
    build: .
    container_name: outlook-daily-briefing-api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./:/app  # Para desarrollo - permite cambios en caliente
    networks:
      - briefing-network

networks:
  briefing-network:
    driver: bridge
